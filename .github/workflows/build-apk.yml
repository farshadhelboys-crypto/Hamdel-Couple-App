name: Build Hamdel APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Kotlin sources v1.6
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/hamdel/couple
          curl -fsSL "https://n.uguu.se/NPiQXbxu.kt" -o android/app/src/main/java/com/hamdel/couple/HamdelApp.kt
          curl -fsSL "https://h.uguu.se/MtMHWzEd.kt" -o android/app/src/main/java/com/hamdel/couple/MainActivity.kt
          wc -c android/app/src/main/java/com/hamdel/couple/*.kt
          grep -q selfSupportTips android/app/src/main/java/com/hamdel/couple/HamdelApp.kt
          grep -q apiCreateRoom android/app/src/main/java/com/hamdel/couple/HamdelApp.kt
          grep -q BootReceiver android/app/src/main/java/com/hamdel/couple/MainActivity.kt
          ! grep -q HamdelPollService android/app/src/main/java/com/hamdel/couple/MainActivity.kt
          echo "Sources OK v1.6"

      - name: Generate launcher icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          # pink heart-style solid icon
          convert -size 512x512 xc:'#1A0A14' -fill '#FF6B9D' -draw "circle 256,230 256,110" -fill '#FF3B6B' -draw "circle 180,200 180,100" -draw "circle 332,200 332,100" -fill '#FF6B9D' -draw "polygon 100,220 256,420 412,220" /tmp/logo.png
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $dens in
              mdpi) sz=48;;
              hdpi) sz=72;;
              xhdpi) sz=96;;
              xxhdpi) sz=144;;
              xxxhdpi) sz=192;;
            esac
            mkdir -p android/app/src/main/res/mipmap-$dens
            convert /tmp/logo.png -resize ${sz}x${sz} android/app/src/main/res/mipmap-$dens/ic_launcher.png
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace --console=plain
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamdel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
